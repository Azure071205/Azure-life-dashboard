<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f9;--text:#16181f;--dim:#6b7280;--border:#e6e8ee;
  --accent:#5b5bd6;--accent-soft:#eef0fe;--green:#10b981;--red:#ef4444;--orange:#f59e0b;
  --radius:14px;
  --card-rgb:255 255 255;--card-alpha:1;
  --panel-rgb:255 255 255;
}
html[data-theme="dark"]{
  --bg:#0e1016;--text:#e8eaf0;--dim:#8b92a4;--border:#262b38;
  --accent:#7c7cf0;--accent-soft:#23263a;
  --card-rgb:24 27 36;--card-alpha:1;
  --panel-rgb:24 27 36;
}
html,body{min-height:100%}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background-color:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
  transition:background-color .2s,color .2s;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:rgba(0,0,0,var(--overlay-alpha,0));
}
.topbar,main,.toast,.modal-mask{position:relative;z-index:1}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;
  background:rgb(var(--panel-rgb) / var(--card-alpha));
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.brand{font-weight:600;font-size:14px;white-space:nowrap;color:var(--text)}
.menu-btn{
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  width:32px;height:32px;padding:7px;border-radius:8px;
  border:1px solid var(--border);background:transparent;cursor:pointer;
  transition:.15s;flex:0 0 auto;
}
.menu-btn:hover{border-color:var(--accent)}
.menu-btn span{
  display:block;height:2px;background:var(--text);border-radius:2px;transition:.15s;
}
.tabs{
  position:absolute;top:calc(100% + 6px);right:12px;
  display:none;flex-direction:column;gap:2px;
  background:rgb(var(--panel-rgb) / 1);
  border:1px solid var(--border);border-radius:12px;padding:6px;
  min-width:180px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
  z-index:60;
}
.tabs.open{display:flex}
.tab{
  border:none;background:transparent;color:var(--text);padding:8px 12px;border-radius:7px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
  text-align:left;width:100%;
}
.tab:hover{background:var(--accent-soft)}
.tab.active{background:var(--accent);color:#fff;font-weight:500}
.menu-divider{
  height:1px;background:var(--border);margin:5px 4px;
}
.menu-auth{
  display:flex;flex-direction:column;gap:6px;padding:4px;
}
.auth-status{
  font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:2px 4px;
}
.menu-auth .btn{width:100%;text-align:center;padding:7px 12px;font-size:12.5px}
main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px;flex-wrap:wrap;gap:8px}
.section-head h2{font-size:18px}
.section-head h3{font-size:15px}
.muted{color:var(--dim);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:rgb(var(--card-rgb) / var(--card-alpha));border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:12px;color:var(--dim);margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat-sub{font-size:12px;color:var(--dim);margin-top:4px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.mod-card{background:rgb(var(--card-rgb) / var(--card-alpha));border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.mod-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.mod-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:7px}
.mod-nums b{color:var(--text);font-weight:600}
.bar{height:7px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s ease}
.mod-foot{margin-top:8px;font-size:12px}
.ok{color:var(--green);font-weight:600}
.bad{color:var(--red);font-weight:600}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:760px){.charts{grid-template-columns:1fr}}
.card{background:rgb(var(--card-rgb) / var(--card-alpha));border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--dim)}
canvas{max-height:280px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
input,select,textarea{
  font-family:inherit;font-size:14px;padding:8px 11px;border-radius:9px;border:1px solid var(--border);
  background:rgb(var(--card-rgb) / var(--card-alpha));color:var(--text);outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{padding:2px;height:36px;width:46px;cursor:pointer}
input[type=range]{padding:0;height:28px;accent-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.6}
.btn{
  font-family:inherit;font-size:13px;padding:8px 15px;border-radius:9px;border:1px solid var(--border);
  background:rgb(var(--card-rgb) / var(--card-alpha));color:var(--text);cursor:pointer;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.88;color:#fff}
.btn.danger{color:var(--red);border-color:var(--border)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form-card{background:rgb(var(--card-rgb) / var(--card-alpha));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.entry{
  display:flex;align-items:center;gap:12px;background:rgb(var(--card-rgb) / var(--card-alpha));border:1px solid var(--border);
  border-radius:11px;padding:11px 14px;margin-bottom:8px;
}
.entry-time{font-size:12px;color:var(--dim);min-width:88px;font-variant-numeric:tabular-nums}
.entry-name{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-note{font-size:12px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-dur{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.icon-btn{border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:7px}
.icon-btn:hover{background:var(--accent-soft);color:var(--red)}
.empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center}
.week-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:18px;
}
.modal{
  background:rgb(var(--panel-rgb) / 1);border-radius:16px;padding:22px;width:100%;max-width:420px;
  border:1px solid var(--border);max-height:88vh;overflow:auto;
}
.modal h3{font-size:16px;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input,.field select{width:100%}
.field .row{margin-top:6px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.timer-display{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:100px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--dim)}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 20px;border-radius:99px;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none;
}
.toast.show{opacity:1}
.heat-wrap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding:4px 0}
.heat-cell{width:14px;height:14px;border-radius:3px;background:var(--accent-soft);cursor:pointer;transition:.15s}
.heat-cell:hover{transform:scale(1.2)}
.heat-legend{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:11px;color:var(--dim)}
.heat-legend .heat-cell{width:12px;height:12px}
.bg-preview{
  width:100%;height:140px;border-radius:10px;border:1px dashed var(--border);
  background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;margin-bottom:10px;
}
</style>

<script>
/* ==================== Supabase 配置 ==================== */
const SUPABASE_URL = 'https://hckumovfavghlxtwvdel.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhja3Vtb3ZmYXZnaGx4dHd2ZGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDk2MTEsImV4cCI6MjEwNzE4NTYxMX0.yFnp5acJt9Rm3txsqyaaueMlmCOPCNkFjqsZKkP8v-k';

let sbClient = null;
let currentUser = null;
let syncTimeout = null;

try {
  if (SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20) {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { console.error('Supabase 初始化失败', e); }

/* ==================== 工具函数 ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function uid(p = 'id') { return p + '_' + Math.random().toString(36).slice(2, 9); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return fmtDate(new Date()); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtHours(min) {
  if (min == null) return '—';
  const h = min / 60;
  if (Number.isInteger(h)) return h + 'h';
  return (Math.round(h * 10) / 10) + 'h';
}
function fmtDuration(min) {
  if (min == null) return '—';
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}小时${m}分`;
  if (h) return `${h}小时`;
  return `${m}分钟`;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}
function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ==================== 状态与持久化 ==================== */
const STORE_KEY = 'life_dashboard_v1';

function defaultState() {
  return {
    settings: {
      weekStart: 1, minUnit: 15, theme: 'light',
      bgImage: '', bgOverlay: 0, cardAlpha: 100, bgBlur: 0,
      accentColor: '', textColor: ''
    },
    modules: [
      { id: 'm_sleep',   name: '睡眠',      color: '#7c5cff', type: 'fixed',  weekly: 3150, parentId: null, order: 0,  archived: false },
      { id: 'm_work',    name: '工作/学业', color: '#3b82f6', type: 'manual', weekly: 2400, parentId: null, order: 1,  archived: false },
      { id: 'm_commute', name: '通勤',      color: '#64748b', type: 'manual', weekly: 300,  parentId: null, order: 2,  archived: false },
      { id: 'm_meals',   name: '吃饭洗漱',  color: '#f59e0b', type: 'manual', weekly: 600,  parentId: null, order: 3,  archived: false },
      { id: 'm_chores',  name: '家务',      color: '#a8a29e', type: 'manual', weekly: 300,  parentId: null, order: 4,  archived: false },
      { id: 'm_health',  name: '健康运动',  color: '#10b981', type: 'manual', weekly: 480,  parentId: null, order: 5,  archived: false },
      { id: 'm_learn',   name: '学习成长',  color: '#06b6d4', type: 'manual', weekly: 360,  parentId: null, order: 6,  archived: false },
      { id: 'm_family',  name: '家庭关系',  color: '#ec4899', type: 'manual', weekly: 360,  parentId: null, order: 7,  archived: false },
      { id: 'm_create',  name: '创作事业',  color: '#8b5cf6', type: 'manual', weekly: 300,  parentId: null, order: 8,  archived: false },
      { id: 'm_social',  name: '社交朋友',  color: '#f97316', type: 'manual', weekly: 180,  parentId: null, order: 9,  archived: false },
      { id: 'm_fun',     name: '休闲娱乐',  color: '#eab308', type: 'manual', weekly: 240,  parentId: null, order: 10, archived: false },
      { id: 'm_reflect', name: '精神反思',  color: '#14b8a6', type: 'manual', weekly: 120,  parentId: null, order: 11, archived: false },
      { id: 'm_other',   name: '未分类',    color: '#9ca3af', type: 'record', weekly: 0,    parentId: null, order: 12, archived: false }
    ],
    dayPlans: {},
    logs: {},
    entries: []
  };
}

let state = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = Object.assign({
        weekStart: 1, minUnit: 15, theme: 'light',
        bgImage: '', bgOverlay: 0, cardAlpha: 100, bgBlur: 0,
        accentColor: '', textColor: ''
      }, s.settings || {});
      s.modules = s.modules || [];
      s.dayPlans = s.dayPlans || {};
      s.logs = s.logs || {};
      s.entries = s.entries || [];
      return s;
    }
  } catch (e) { console.error(e); }
  return defaultState();
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('保存失败', e); }
  if (currentUser) {
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(() => { syncToCloud(); }, 2000);
  }
}

/* ==================== 外观应用 ==================== */
function applyAppearance() {
  const s = state.settings;

  // 主色调
  if (s.accentColor) document.documentElement.style.setProperty('--accent', s.accentColor);
  else document.documentElement.style.removeProperty('--accent');

  // 文字颜色
  if (s.textColor) document.documentElement.style.setProperty('--text', s.textColor);
  else document.documentElement.style.removeProperty('--text');

  // 背景图
  const body = document.body;
  if (s.bgImage) {
    body.style.backgroundImage = `url(${s.bgImage})`;
  } else {
    body.style.backgroundImage = '';
  }

  // 遮罩暗度
  document.documentElement.style.setProperty('--overlay-alpha', (s.bgOverlay || 0) / 100);

  // 卡片透明度
  document.documentElement.style.setProperty('--card-alpha', (s.cardAlpha || 100) / 100);

  // 主题
  document.documentElement.dataset.theme = s.theme || 'light';
}

/* 图片压缩到 base64 */
function compressImage(file, maxWidth = 1920, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ==================== 云同步逻辑 ==================== */
async function syncToCloud() {
  if (!currentUser || !sbClient) return;
  try {
    if (state.modules.length) {
      const payload = state.modules.map(m => ({
        id: m.id, user_id: currentUser.id, name: m.name, color: m.color,
        type: m.type, weekly: m.weekly, parent_id: m.parentId,
        order: m.order, archived: m.archived, updated_at: new Date().toISOString()
      }));
      const { error } = await sbClient.from('modules').upsert(payload);
      if (error) console.error('同步模块失败', error);
    }

    if (state.entries.length) {
      const payload = state.entries.map(e => ({
        id: e.id, user_id: currentUser.id, date: e.date,
        start_time: e.start, end_time: e.end, duration: e.duration,
        module_id: e.moduleId, note: e.note, created_at: e.createdAt,
        updated_at: new Date().toISOString()
      }));
      const chunkSize = 300;
      for (let i = 0; i < payload.length; i += chunkSize) {
        const chunk = payload.slice(i, i + chunkSize);
        const { error } = await sbClient.from('entries').upsert(chunk);
        if (error) console.error('同步记录失败', error);
      }
    }

    const dayPlanKeys = Object.keys(state.dayPlans);
    if (dayPlanKeys.length) {
      const payload = dayPlanKeys.map(d => ({
        id: d, user_id: currentUser.id, date: d,
        targets: state.dayPlans[d], updated_at: new Date().toISOString()
      }));
      const { error } = await sbClient.from('day_plans').upsert(payload);
      if (error) console.error('同步日计划失败', error);
    }

    const logKeys = Object.keys(state.logs);
    if (logKeys.length) {
      const payload = logKeys.map(d => ({
        id: d, user_id: currentUser.id, date: d,
        content: state.logs[d] || '', updated_at: new Date().toISOString()
      }));
      const { error } = await sbClient.from('daily_logs').upsert(payload);
      if (error) console.error('同步日志失败', error);
    }

    console.log('☁️ 云端同步完成');
  } catch (err) {
    console.error('同步异常', err);
  }
}

async function syncFromCloud() {
  if (!currentUser || !sbClient) return;
  try {
    const { data: cm } = await sbClient.from('modules').select('*');
    const { data: ce } = await sbClient.from('entries').select('*');
    const { data: cdp } = await sbClient.from('day_plans').select('*');
    const { data: cl } = await sbClient.from('daily_logs').select('*');

    const cloudEmpty = (!cm || cm.length === 0) && (!ce || ce.length === 0)
                    && (!cdp || cdp.length === 0) && (!cl || cl.length === 0);

    if (cloudEmpty) {
      await syncToCloud();
      save();
      render();
      return;
    }

    if (cm) {
      state.modules = cm.map(item => ({
        id: item.id, name: item.name, color: item.color, type: item.type,
        weekly: item.weekly, parentId: item.parent_id, order: item.order, archived: item.archived
      }));
    }
    if (ce) {
      state.entries = ce.map(item => ({
        id: item.id, date: item.date, start: item.start_time, end: item.end_time,
        duration: item.duration, moduleId: item.module_id, note: item.note, createdAt: item.created_at
      }));
    }
    if (cdp) {
      state.dayPlans = {};
      cdp.forEach(item => { state.dayPlans[item.date] = item.targets || {}; });
    }
    if (cl) {
      state.logs = {};
      cl.forEach(item => { state.logs[item.date] = item.content || ''; });
    }

    save();
    render();
    console.log('☁️ 云端数据已拉取并覆盖本地');
  } catch (err) {
    console.error('拉取云端数据失败', err);
  }
}

async function deleteFromCloud(table, id) {

  try {
    await sbClient.from(table).delete().eq('id', id).eq('user_id', currentUser.id);
  } catch (e) { console.error('云端删除异常', e); }
}

async function clearCloud() {
  if (!currentUser || !sbClient) return;
  try {
    await sbClient.from('modules').delete().eq('user_id', currentUser.id);
    await sbClient.from('entries').delete().eq('user_id', currentUser.id);
    await sbClient.from('day_plans').delete().eq('user_id', currentUser.id);
    await sbClient.from('daily_logs').delete().eq('user_id', currentUser.id);
  } catch (e) { console.error('清空云端失败', e); }

/* ==================== 日期工具 ==================== */
function getWeekStart(dateStr) {
  const d = parseDate(dateStr);
  const ws = state.settings.weekStart;
  const diff = (d.getDay() - ws + 7) % 7;
  d.setDate(d.getDate() - diff);
  return fmtDate(d);
}
function getWeekDays(ws) {
  const d = parseDate(ws), out = [];
  for (let i = 0; i < 7; i++) { out.push(fmtDate(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function shiftWeek(ws, n) {
  const d = parseDate(ws);
  d.setDate(d.getDate() + n * 7);
  return fmtDate(d);
}
const WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

/* ==================== 日计划/周目标 计算 ==================== */
function getDefaultDaily(m) {
  if (m.type === 'record') return null;
  return Math.round((m.weekly || 0) / 7);
}

function getDayTarget(dateStr, moduleId) {
  const custom = (state.dayPlans[dateStr] || {})[moduleId];
  if (custom != null) return custom;
  const m = state.modules.find(x => x.id === moduleId);
  if (!m) return null;
  return getDefaultDaily(m);
}

function getWeekTargets(ws) {
  const days = getWeekDays(ws);
  const totals = {};
  state.modules.filter(m => !m.archived).forEach(m => {
    if (m.type === 'record') { totals[m.id] = null; return; }
    let sum = 0;
    days.forEach(d => {
      const t = getDayTarget(d, m.id);
      if (t != null) sum += t;
    });
    totals[m.id] = sum;
  });
  return totals;
}

function getWeekModules(ws) {
  const targets = getWeekTargets(ws);
  const mods = state.modules.filter(m => !m.archived).sort((a, b) => a.order - b.order);
  return mods.map(m => ({
    id: m.id, name: m.name, color: m.color, type: m.type, target: targets[m.id] ?? null
  }));
}

/* ==================== 实际记录汇总 ==================== */
function getWeekEntries(ws) {
  const set = new Set(getWeekDays(ws));
  return state.entries.filter(e => set.has(e.date));
}
function getWeekActuals(ws) {
  const totals = {};
  getWeekEntries(ws).forEach(e => {
    totals[e.moduleId] = (totals[e.moduleId] || 0) + e.duration;
  });
  return totals;
}

/* ==================== 仪表盘 ==================== */
function renderDashboard(app) {
  const ws = getWeekStart(todayStr());
  const days = getWeekDays(ws);
  const mods = getWeekModules(ws);
  const actuals = getWeekActuals(ws);
  const TOTAL = 168 * 60;

  let fixedMin = 0, manualMin = 0;
  mods.forEach(m => {
    if (m.type === 'fixed') fixedMin += (m.target || 0);
    else if (m.type === 'manual') manualMin += (m.target || 0);
  });
  const allocMin = TOTAL - fixedMin;
  const unassignedMin = allocMin - manualMin;

  let recordedMin = 0;
  for (const k in actuals) recordedMin += actuals[k];
  const unrecordedMin = Math.max(0, TOTAL - recordedMin);

  app.innerHTML = `
    <div class="section-head">
      <h2>本周总览</h2>
      <div class="muted">${ws} ~ ${days[6]}（自然周）</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">一周总时间</div><div class="stat-value">168h</div><div class="stat-sub">7 × 24 小时</div></div>
      <div class="stat"><div class="stat-label">固定</div><div class="stat-value">${fmtHours(fixedMin)}</div><div class="stat-sub">已锁定</div></div>
      <div class="stat"><div class="stat-label">可分配</div><div class="stat-value">${fmtHours(allocMin)}</div><div class="stat-sub">未分配 ${fmtHours(Math.max(0, unassignedMin))}</div></div>
      <div class="stat"><div class="stat-label">已记录</div><div class="stat-value">${fmtHours(recordedMin)}</div><div class="stat-sub">未记录 ${fmtHours(unrecordedMin)}</div></div>
    </div>
    <div class="section-head"><h3>模块进度</h3><div class="muted">本周目标 vs 实际</div></div>
    <div class="mod-grid" id="modGrid"></div>
    <div class="charts">
      <div class="card"><div class="card-title">本周实际时间分布</div><canvas id="donut"></canvas></div>
      <div class="card"><div class="card-title">每日时间分布（小时）</div><canvas id="stack"></canvas></div>
    </div>
  `;

  const grid = $('#modGrid');
  if (!mods.length) grid.innerHTML = '<div class="empty">还没有模块，去「模块」页面添加吧</div>';

  mods.forEach(m => {
    const actual = actuals[m.id] || 0;
    const target = m.target;
    const el = document.createElement('div');
    el.className = 'mod-card';
    let pct = 0, foot = '';
    if (target) {
      pct = Math.min(100, Math.round(actual / target * 100));
      const diff = actual - target;
      foot = diff >= 0
        ? `<span class="ok">已达成 +${fmtHours(diff)}</span>`
        : `<span class="bad">还差 ${fmtHours(-diff)}</span>`;
    } else {
      foot = `<span class="muted">仅记录，不设目标</span>`;
    }
    el.innerHTML = `
      <div class="mod-head">
        <span class="dot" style="background:${m.color}"></span>
        <span class="mod-name">${esc(m.name)}</span>
      </div>
      <div class="mod-nums">
        <span>目标 <b>${target ? fmtHours(target) : '—'}</b></span>
        <span>实际 <b>${fmtHours(actual)}</b></span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
      <div class="mod-foot">${foot}</div>
    `;
    grid.appendChild(el);
  });

  drawDonut(mods, actuals);
  drawStack(days, mods, ws);
}

function drawDonut(mods, actuals) {
  const cv = $('#donut');
  if (!cv || typeof Chart === 'undefined') return;
  if (donutChart) donutChart.destroy();
  const labels = [], data = [], colors = [];
  mods.forEach(m => {
    const v = actuals[m.id] || 0;
    if (v > 0) { labels.push(m.name); data.push(v / 60); colors.push(m.color); }
  });
  if (!data.length) {
    cv.parentElement.innerHTML = '<div class="card-title">本周实际时间分布</div><div class="empty">本周还没有记录</div>';
    return;
  }
  const dark = state.settings.theme === 'dark';
  donutChart = new Chart(cv, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: true, cutout: '62%',
      plugins: {
        legend: { position: 'right', labels: { color: dark ? '#e8eaf0' : '#16181f', boxWidth: 10, font: { size: 12 } } },
        tooltip: { callbacks: { label: c => ` ${c.label}: ${c.parsed.toFixed(1)}h` } }
      }
    }
  });
}

function drawStack(days, mods, ws) {
  const cv = $('#stack');
  if (!cv || typeof Chart === 'undefined') return;
  if (stackChart) stackChart.destroy();

  const byDay = {};
  days.forEach(d => byDay[d] = {});
  getWeekEntries(ws).forEach(e => {
    if (!byDay[e.date]) return;
    byDay[e.date][e.moduleId] = (byDay[e.date][e.moduleId] || 0) + e.duration;
  });

  const datasets = [];
  mods.forEach(m => {
    const data = days.map(d => ((byDay[d] || {})[m.id] || 0) / 60);
    if (data.some(v => v > 0)) {
      datasets.push({ label: m.name, data, backgroundColor: m.color, borderRadius: 4, stack: 's' });
    }
  });

  if (!datasets.length) {
    cv.parentElement.innerHTML = '<div class="card-title">每日时间分布（小时）</div><div class="empty">本周还没有记录</div>';
    return;
  }

  const dark = state.settings.theme === 'dark';
  const gridColor = dark ? '#262b38' : '#e6e8ee';
  const tickColor = dark ? '#8b92a4' : '#6b7280';

  stackChart = new Chart(cv, {
    type: 'bar',
    data: { labels: days.map(d => d.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: true,
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: tickColor, font: { size: 11 } } },
        y: { stacked: true, grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 } } }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}h` } }
      }
    }
  });
}

    let duration = Math.max(unit, Math.round(seconds / 60 / unit) * unit);

function tickTimer() {
  if (!timerState.start) return;
  const el = $('#tmDisplay');
  if (!el) return;
  const sec = Math.floor((Date.now() - timerState.start) / 1000);
  const h = String(Math.floor(sec / 3600)).padStart(2, '0');
  const m = String(Math.floor(sec % 3600 / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  el.textContent = `${h}:${m}:${s}`;
}

function renderModules(app) {
  const mods = [...state.modules].sort((a, b) => a.order - b.order);
  const typeLabel = { fixed: '固定', manual: '手动目标', record: '仅记录' };
  const typeColor = { fixed: '#7c5cff', manual: '#3b82f6', record: '#9ca3af' };

  app.innerHTML = `

        <tbody id="modBody"></tbody>
      </table>
    </div>

    </div>

  const tbody = $('#modBody');

  mods.forEach(m => {
    const tr = document.createElement('tr');
    if (m.archived) tr.style.opacity = '.45';

    tr.innerHTML = `
      <td><span class="dot" style="background:${m.color}"></span></td>
      <td style="font-weight:600">${esc(m.name)}</td>
      <td><span class="tag" style="background:${typeColor[m.type]}22;color:${typeColor[m.type]}">${typeLabel[m.type]}</span></td>
      <td>${dailyMin != null ? fmtHours(dailyMin) : '<span class="muted">—</span>'}</td>
      <td>${m.archived ? '<span class="muted">已归档</span>' : '<span class="ok">使用中</span>'}</td>
      <td>
        <button class="btn sm" data-edit="${m.id}">编辑</button>
        <button class="btn sm" data-arch="${m.id}">${m.archived ? '恢复' : '归档'}</button>
        <button class="btn sm danger" data-del="${m.id}">删除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.addEventListener('click', ev => {
    const editBtn = ev.target.closest('[data-edit]');
    const archBtn = ev.target.closest('[data-arch]');
    const delBtn = ev.target.closest('[data-del]');

    if (editBtn) openModuleModal(editBtn.dataset.edit);
    if (archBtn) {
      const m = state.modules.find(x => x.id === archBtn.dataset.arch);
      m.archived = !m.archived;
      save(); render();
    }
    if (delBtn) {
      const id = delBtn.dataset.del;
      const used = state.entries.some(e => e.moduleId === id);
      if (used && !confirm('该模块已有记录，删除后这些记录将显示为「已删除模块」。确定删除？')) return;
      if (!used && !confirm('确定删除该模块？')) return;
      state.modules = state.modules.filter(x => x.id !== id);
      save();
      deleteFromCloud('modules', id);
      render();
    }
  });

  $('#addMod').onclick = () => openModuleModal(null);
}

function openModuleModal(id) {
  const isNew = !id;
  const m = isNew
    ? { id: uid('m'), name: '', color: '#6366f1', type: 'manual', weekly: 0, parentId: null, order: state.modules.length, archived: false }
    : { ...state.modules.find(x => x.id === id) };

  const parents = state.modules.filter(x => x.id !== m.id && !x.parentId);
  const dailyHours = (m.weekly || 0) / 7 / 60;

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <h3>${isNew ? '新建模块' : '编辑模块'}</h3>
      <div class="field"><label>名称</label><input id="mName" value="${esc(m.name)}" placeholder="例如：健康运动"></div>
      <div class="field"><label>颜色</label><input type="color" id="mColor" value="${m.color}"></div>
      <div class="field"><label>类型</label>
        <select id="mType">
          <option value="fixed" ${m.type === 'fixed' ? 'selected' : ''}>固定（每天写死）</option>
          <option value="manual" ${m.type === 'manual' ? 'selected' : ''}>手动目标（每天可调）</option>
          <option value="record" ${m.type === 'record' ? 'selected' : ''}>仅记录（不设目标）</option>
        </select>
      </div>
      <div class="field"><label>默认每日目标（小时）</label>
        <input type="number" id="mDaily" step="0.25" min="0" value="${dailyHours.toFixed(2)}">
      </div>
      <div class="field"><label>父模块（可选）</label>
        <select id="mParent">
          <option value="">（无）</option>
          ${parents.map(p => `<option value="${p.id}" ${m.parentId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn" id="mCancel">取消</button>
        <button class="btn primary" id="mSave">保存</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);

  const close = () => mask.remove();
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  $('#mCancel', mask).onclick = close;
  $('#mSave', mask).onclick = () => {
    const name = $('#mName', mask).value.trim();
    if (!name) { toast('请填写名称'); return; }
    m.name = name;
    m.color = $('#mColor', mask).value;
    m.type = $('#mType', mask).value;
    const dailyH = parseFloat($('#mDaily', mask).value) || 0;
    m.weekly = Math.round(dailyH * 7 * 60);
    m.parentId = $('#mParent', mask).value || null;

    if (isNew) state.modules.push(m);
    else {
      const idx = state.modules.findIndex(x => x.id === m.id);
      state.modules[idx] = m;
    }
    save(); close(); toast('已保存'); render();
  };
}

function drawTrend(mods) {
  const cv = $('#trendCanvas');
  if (!cv || typeof Chart === 'undefined') return;
  if (trendChart) trendChart.destroy();

  const weeks = [];
  let w = getWeekStart(todayStr());
  for (let i = 7; i >= 0; i--) weeks.push(shiftWeek(w, -i));

  const activeMods = mods.filter(m => {
    if (m.type === 'record') return false;
    return weeks.some(ws => (getWeekActuals(ws)[m.id] || 0) > 0);
  }).slice(0, 8);

  if (!activeMods.length) {
    cv.parentElement.innerHTML = '<div class="card-title">近 8 周趋势（小时）</div><div class="empty">还没有足够数据</div>';
    return;
  }

  const dark = state.settings.theme === 'dark';
  const tickColor = dark ? '#8b92a4' : '#6b7280';
  const gridColor = dark ? '#262b38' : '#e6e8ee';

  const datasets = activeMods.map(m => ({
    label: m.name,
    data: weeks.map(ws => ((getWeekActuals(ws)[m.id] || 0) / 60)),
    borderColor: m.color,
    backgroundColor: m.color + '22',
    tension: 0.3,
    borderWidth: 2,
    pointRadius: 3
  }));

  trendChart = new Chart(cv, {
    type: 'line',
    data: { labels: weeks.map(w => w.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: true,
      scales: {
        x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 11 } } },
        y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 } }, beginAtZero: true }
      },
      plugins: {
        legend: { labels: { color: tickColor, boxWidth: 10, font: { size: 11 } } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}h` } }
      }
    }
  });
}

function drawHeatmap() {
  const wrap = $('#heatWrap');
  if (!wrap) return;

  const today = new Date();
  const cells = [];
  for (let i = 83; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = fmtDate(d);
    const total = state.entries.filter(e => e.date === ds).reduce((s, e) => s + e.duration, 0);
    const hasLog = state.logs[ds] && state.logs[ds].trim();
    cells.push({ date: ds, total, hasLog });
  }

  const max = Math.max(...cells.map(c => c.total), 1);

  const firstDate = parseDate(cells[0].date);
  const firstDay = firstDate.getDay();
  const ws = state.settings.weekStart;
  const offset = (firstDay - ws + 7) % 7;
  const padded = [];
  for (let i = 0; i < offset; i++) padded.push(null);
  padded.push(...cells);

  wrap.innerHTML = padded.map(c => {
    if (!c) return '<div></div>';
    let bg = 'var(--accent-soft)';
    if (c.total > 0) {
      const ratio = c.total / max;
      let alpha = 0.35;
      if (ratio > 0.75) alpha = 1;
      else if (ratio > 0.5) alpha = 0.85;
      else if (ratio > 0.25) alpha = 0.6;
      bg = `rgba(91,91,214,${alpha})`;
    }
    const title = `${c.date}\n记录：${fmtDuration(c.total)}${c.hasLog ? '\n有日志' : ''}`;
    const border = c.hasLog ? '2px solid var(--green)' : 'none';
    return `<div class="heat-cell" style="background:${bg};border:${border}" title="${esc(title)}"></div>`;
  }).join('');
}

    </div>

    <div class="card">
      <div class="card-title">账号状态</div>
      <div class="muted" id="accountInfo">
        ${currentUser ? '已登录：' + esc(currentUser.email) : '未登录（数据仅保存在本机浏览器）'}
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">统计</div>
      <div class="muted">
        模块数：${state.modules.length} ｜ 记录条数：${state.entries.length} ｜ 日计划数：${Object.keys(state.dayPlans).length} ｜ 日志数：${Object.keys(state.logs).length}
      </div>
    </div>
  `;

  // 背景图上传
  $('#bgUploadBtn').onclick = () => $('#bgFile').click();
  $('#bgFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('请选择图片文件'); return; }
    try {
      toast('正在处理图片…');
      const dataUrl = await compressImage(file, 1920, 0.82);
      state.settings.bgImage = dataUrl;
      save();
      applyAppearance();
      toast('背景已设置');
      render();
    } catch (err) {
      toast('处理失败：' + err.message);
    }
  };
  $('#bgClearBtn').onclick = () => {
    if (!state.settings.bgImage) { toast('还没有背景图'); return; }
    if (!confirm('确定清除背景图？')) return;
    state.settings.bgImage = '';
    save();
    applyAppearance();
    toast('已清除');
    render();
  };

  // 遮罩暗度
  $('#bgOverlay').oninput = e => {
    const v = Number(e.target.value);
    state.settings.bgOverlay = v;
    document.documentElement.style.setProperty('--overlay-alpha', v / 100);
    $('#overlayVal').textContent = v;
  };
  $('#bgOverlay').onchange = () => { save(); };

  // 卡片透明度
  $('#cardAlpha').oninput = e => {
    const v = Number(e.target.value);
    state.settings.cardAlpha = v;
    document.documentElement.style.setProperty('--card-alpha', v / 100);
    $('#alphaVal').textContent = v;
  };
  $('#cardAlpha').onchange = () => { save(); };

  // 主色调
  $('#accentColor').oninput = e => {
    state.settings.accentColor = e.target.value;
    document.documentElement.style.setProperty('--accent', e.target.value);
  };
  $('#accentColor').onchange = () => { save(); };
  $('#accentReset').onclick = () => {
    state.settings.accentColor = '';
    document.documentElement.style.removeProperty('--accent');
    save(); render();
  };

  // 文字颜色
  $('#textColor').oninput = e => {
    state.settings.textColor = e.target.value;
    document.documentElement.style.setProperty('--text', e.target.value);
  };
  $('#textColor').onchange = () => { save(); };
  $('#textReset').onclick = () => {
    state.settings.textColor = '';
    document.documentElement.style.removeProperty('--text');
    save(); render();
  };

  // 主题
  $('#setTheme').onchange = e => {
    state.settings.theme = e.target.value;
    applyAppearance();
    save();
    toast('已切换');
    if (currentView === 'dashboard') render();
  };

  $('#setWeekStart').onchange = e => { state.settings.weekStart = Number(e.target.value); save(); toast('已保存'); };
  $('#setUnit').onchange = e => { state.settings.minUnit = Number(e.target.value); save(); toast('已保存'); };

  $('#exportBtn').onclick = () => {
    download(`life-dashboard-${todayStr()}.json`, JSON.stringify(state, null, 2), 'application/json');
    toast('已导出');
  };

  $('#exportMd').onclick = () => {
    let md = `# 人生时间仪表盘\n\n导出时间：${new Date().toLocaleString()}\n\n`;
    const logKeys = Object.keys(state.logs).sort();
    if (logKeys.length) {
      md += `## 每日日志\n\n`;
      logKeys.forEach(d => { md += `### ${d}\n\n${state.logs[d]}\n\n`; });
    }
    md += `## 每周目标 vs 实际\n\n`;
    const allWeeks = new Set();
    state.entries.forEach(e => allWeeks.add(getWeekStart(e.date)));
    allWeeks.add(getWeekStart(todayStr()));
    const weeksSorted = [...allWeeks].sort();
    weeksSorted.forEach(ws => {
      const mods = getWeekModules(ws);
      const actuals = getWeekActuals(ws);
      md += `### ${ws} ~ ${getWeekDays(ws)[6]}\n\n`;
      md += `| 模块 | 目标 | 实际 | 差额 |\n|---|---:|---:|---:|\n`;
      mods.forEach(m => {
        const a = actuals[m.id] || 0;
        const t = m.target || 0;
        const diff = a - t;
        md += `| ${m.name} | ${t ? fmtHours(t) : '—'} | ${fmtHours(a)} | ${t ? (diff >= 0 ? '+' : '') + fmtHours(diff) : '—'} |\n`;
      });
      md += `\n`;
    });
    download(`life-dashboard-logs-${todayStr()}.md`, md, 'text/markdown;charset=utf-8');
    toast('已导出 Markdown');
  };

  $('#exportCsv').onclick = () => {
    const headers = ['日期', '开始', '结束', '时长（分钟）', '模块', '备注'];
    const rows = state.entries
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date) || (a.start || '').localeCompare(b.start || ''))
      .map(e => {
        const m = state.modules.find(x => x.id === e.moduleId);
        return [e.date, e.start || '', e.end || '', e.duration, m ? m.name : '已删除模块', e.note || ''];
      });
    const csv = [headers, ...rows].map(row => row.map(cell => {
      const s = String(cell);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')).join('\n');
    download(`life-dashboard-entries-${todayStr()}.csv`, '\ufeff' + csv, 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  };

  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.modules || !data.entries) throw new Error('格式不对');
        if (!confirm('导入会覆盖当前所有数据，确定继续？')) return;
        state = data;
        state.settings = Object.assign({
          weekStart: 1, minUnit: 15, theme: 'light',
          bgImage: '', bgOverlay: 0, cardAlpha: 100, bgBlur: 0,
          accentColor: '', textColor: ''
        }, state.settings || {});
        state.dayPlans = state.dayPlans || {};
        state.logs = state.logs || {};
        save();
        applyAppearance();
        reviewWeek = getWeekStart(todayStr());
        toast('导入成功');
        render();
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };

  $('#resetBtn').onclick = async () => {
    if (!confirm('确定清空所有数据？此操作不可恢复。')) return;
    if (!confirm('再确认一次：真的要清空吗？')) return;
    await clearCloud();
    localStorage.removeItem(STORE_KEY);
    state = defaultState();
    save();
    applyAppearance();
    toast('已清空');
    render();
  };
}

/* ==================== PWA 注册 ==================== */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').then(() => {
    console.log('📱 Service Worker 已注册');
  }).catch(e => {
    console.warn('Service Worker 注册失败（不影响使用）', e);
  });
}

/* ==================== 初始化 ==================== */
function init() {
  state = loadState();

  viewDate = todayStr();
  planDate = todayStr();
  reviewWeek = getWeekStart(todayStr());

  applyAppearance();

  $('#tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    $$('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    $('#tabs').classList.remove('open');
    render();
  });

  $('#menuBtn').addEventListener('click', e => {
    e.stopPropagation();
    $('#tabs').classList.toggle('open');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#tabs') && !e.target.closest('#menuBtn')) {
      $('#tabs').classList.remove('open');
    }
  });

  $('#authBtn').onclick = () => {
    if (currentUser) {
      if (!confirm('确定退出登录？')) return;
      sbClient.auth.signOut().then(() => toast('已退出'));
    } else {
      openAuthModal();
    }
  };

  if (sbClient) {
    sbClient.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        currentUser = session.user;
        $('#authStatus').textContent = currentUser.email;
        $('#authBtn').textContent = '退出登录';
        syncFromCloud().then(() => render());
      } else {
        currentUser = null;
        $('#authStatus').textContent = '';
        $('#authBtn').textContent = '登录 / 注册';
        render();
      }
    });
  }

  render();
  registerSW();
}

init();
</script>
</body>
</html>
